<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Page</title> <!-- Title will be set dynamically -->
    <link rel="icon" type="image/x-icon" href="Fotos/Icons/Leonimagenmodificada.ico">

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Unified Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased overflow-x-hidden"> <!-- Theme class will be added here -->

    <!-- Music Toggle Button -->
    <div class="fixed top-4 right-4 z-50">
        <button id="musicToggle" class="bg-amber-600 hover:bg-amber-700 text-white p-3 rounded-full shadow-lg transition-all duration-300 animate-bounce-gentle">
            <i class="fas fa-music text-xl"></i>
        </button>
    </div>

    <!-- Progress Bar -->
    <div class="fixed top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-sm">
        <div id="progressBar" class="progress-bar" style="width: 0%"></div>
    </div>

    <!-- Floating Illustrations Container -->
    <div id="floating-illustrations" class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
        <!-- Illustrations will be injected here -->
    </div>

    <div class="container mx-auto p-4 sm:p-8 max-w-5xl relative z-10">

        <div id="recipe-container" class="bg-white rounded-3xl shadow-2xl overflow-hidden animate-fadeInUp">

            <!-- Header -->
            <div class="relative h-80 overflow-hidden">
                <div id="header-background" class="absolute inset-0"></div> <!-- Background will be set by theme -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>

                <div id="header-ambiance" class="absolute top-4 right-4">
                    <!-- Ambiance icons will be injected here -->
                </div>

                <header class="absolute bottom-0 left-0 p-6 sm:p-10 w-full">
                    <h1 id="recipe-title" class="font-title text-7xl text-white animate-wiggle"></h1>
                    <p id="recipe-subtitle" class="text-yellow-100 mt-3 text-2xl italic animate-fadeInUp delay-1"></p>

                    <!-- Recipe Info Cards -->
                    <div id="recipe-info-cards" class="flex flex-wrap gap-4 mt-6">
                        <!-- Info cards will be injected here -->
                    </div>
                </header>
            </div>

            <div class="p-6 sm:p-10">

                <!-- Love Message Section -->
                <div id="love-message-container" class="love-message mb-10 animate-fadeInUp delay-1">
                    <!-- Love message content will be injected here -->
                </div>

                <!-- Cooking Mode Toggle -->
                <div class="text-center mb-8">
                    <button id="bakingModeBtn" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg transition-all duration-300 animate-glow">
                        <!-- Button text will be set dynamically -->
                    </button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

                    <!-- Ingredients Section -->
                    <div class="lg:col-span-1">
                        <h2 id="ingredients-title" class="font-heading text-4xl text-amber-900 mb-8 heading-decorated"></h2>

                        <div class="mb-6">
                            <button id="shoppingListBtn" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg font-semibold transition-all duration-300 animate-wiggle">
                                <i class="fas fa-shopping-cart mr-2"></i>
                                Shopping List
                            </button>
                        </div>

                        <ul id="ingredient-list" class="space-y-6 text-lg text-gray-700">
                            <!-- Ingredient items will be injected here -->
                        </ul>

                        <!-- Timer Section -->
                        <div id="timer-section" class="mt-10 text-center">
                             <!-- Timer will be injected here if needed by the recipe -->
                        </div>
                    </div>

                    <!-- Instructions Section -->
                    <div class="lg:col-span-2">
                        <h2 id="instructions-title" class="font-heading text-4xl text-amber-900 mb-8 heading-decorated"></h2>

                        <!-- Step Progress Indicator -->
                        <div id="step-progress-indicator" class="mb-8 bg-gray-100 rounded-full p-2">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-semibold text-gray-600 px-4">Progress:</span>
                                <div id="step-dots" class="flex space-x-2 flex-grow px-4">
                                    <!-- Step dots will be injected here -->
                                </div>
                                <span id="stepCounter" class="text-sm font-bold text-amber-800 px-4">0/0</span>
                            </div>
                        </div>

                        <ol id="instruction-list" class="space-y-8 text-lg text-gray-700">
                            <!-- Instruction steps will be injected here -->
                        </ol>

                        <!-- Completion Celebration -->
                        <div id="completionCelebration" class="hidden mt-10 text-center animate-fadeInUp">
                           <!-- Completion message will be injected here -->
                        </div>
                    </div>
                </div>

                <!-- Final Storage Section -->
                <div id="storage-section" class="mt-16 border-t-4 border-double border-amber-300 pt-10 text-center" style="animation: fadeIn 1s 1.8s ease-out both;">
                    <!-- Storage info will be injected here -->
                </div>

                <!-- Rating and Feedback Section -->
                <div class="mt-12 text-center">
                    <h3 id="rating-prompt" class="font-heading text-2xl text-gray-700 mb-6"></h3>
                    <div id="recipeRating" class="flex justify-center space-x-2 mb-4">
                        <!-- Rating icons (stars/hearts) will be injected here -->
                    </div>
                    <div id="ratingMessage" class="text-lg font-semibold text-amber-600 hidden animate-fadeInUp"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container">
        <!-- Modals will be injected here -->
    </div>

    <!-- Hidden Audio Element for Background Music -->
    <audio id="backgroundMusic" loop>
        <!-- Audio source will be set dynamically -->
    </audio>

    <!-- Unified Recipe Script -->
    <script src="script.js"></script> <!-- Contains recipe data -->
    <script src="recipe.js"></script> <!-- Contains all logic -->
</body>
</html>
