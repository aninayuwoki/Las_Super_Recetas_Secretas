<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Libro de Recetas Mágicas</title>
    <link rel="icon" type="image/x-icon" href="Fotos/Icons/Leonimagenmodificada.ico">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Unified Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Add a little extra for the main page */
        .recipe-card {
            opacity: 0; /* Start hidden for animation */
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .recipe-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto p-4 sm:p-8 max-w-5xl">

        <!-- Header -->
        <header class="text-center my-12 animate-fadeInUp">
            <h1 class="font-title text-6xl md:text-8xl text-amber-800" style="text-shadow: 3px 3px 8px rgba(0,0,0,0.2);">
                El super libro de recetas de mi Fresita
            </h1>
            <p class="text-amber-700 mt-4 text-xl md:text-2xl italic delay-1 animate-fadeInUp">
                Una colección de bocaditos hechos con mucho amor.
            </p>
        </header>

        <!-- Recipe List Container -->
        <main>
            <div id="recipe-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Las recetas se cargarán aquí desde script.js -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-16 text-amber-700 animate-fadeInUp delay-2">
            <p>&copy; 2025 - Creado con mucho amor por tu gatito miau.</p>
        </footer>

    </div>

    <!-- Script to load recipes -->
    <script src="script.js"></script>
    <script>
        // Intersection Observer to animate cards on scroll
        document.addEventListener('DOMContentLoaded', () => {
            const recipeList = document.getElementById('recipe-list');

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1
            });

            // We need to observe the cards after they are created.
            // A MutationObserver is perfect for this.
            const mutationObserver = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    mutation.addedNodes.forEach(node => {
                        if (node.nodeType === 1 && node.classList.contains('recipe-card')) {
                            observer.observe(node);
                        }
                    });
                });
            });

            mutationObserver.observe(recipeList, { childList: true });
        });
    </script>
</body>
</html>
